
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Science Fair Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf6ff;
            margin: 0;
            text-align: center;
        }

        header {
            background: #003366;
            color: white;
            padding: 20px;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .field {
            display: flex;
            align-items: center;
            margin: 12px 0;
            text-align: left;
        }

        .field label {
            width: 130px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="tel"],
        input[type="email"],
        select {
            flex: 1;
            min-width: 0;
            padding: 10px;
        }

        .options {
            flex: 1;
        }

        .options label {
            width: auto;
            margin-right: 10px;
            font-weight: normal;
        }

        button {
            background: #0077b6;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #023e8a;
        }

        footer {
            background: #003366;
            color: white;
            padding: 15px;
        }

        @media (max-width: 500px) {
            .field {
                display: block;
            }

            .field label {
                display: block;
                margin-bottom: 8px;
            }

            .options {
                display: block;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>SCIENCE FAIR 2026</h1>
    <h3>Explore Science Through Innovation</h3>
</header>

<div class="container">

    <h2>User Registration Form</h2>

    <form action="/server" method="POST">

        <div class="field">
            <label>Name *</label>
            <input type="text" name="name" required>
        </div>

        <div class="field">
            <label>Password *</label>
            <input type="password"
                   name="password"
                   minlength="6"
                   required>
        </div>

        <div class="field">
            <label>Age *</label>
            <input type="number"
                   name="age"
                   min="1"
                   max="120"
                   required>
        </div>

        <div class="field">
            <label>Mobile Number *</label>
            <input type="tel"
                   name="mobile"
                   pattern="[0-9]{10}"
                   maxlength="10"
                   required>
        </div>

        <div class="field">
            <label>Email *</label>
            <input type="email" name="email" required>
        </div>

        <div class="field">
            <label>Gender *</label>

            <div class="options">
                <label>
                    <input type="radio"
                           name="gender"
                           value="Male"
                           required>
                    Male
                </label>

                <label>
                    <input type="radio"
                           name="gender"
                           value="Female">
                    Female
                </label>
            </div>
        </div>

        <div class="field">
            <label>State *</label>

            <select name="state" required>
                <option value="">Select State</option>
                <option value="Kerala">Kerala</option>
                <option value="Tamilnadu">Tamilnadu</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Andhra Pradesh">Andhra Pradesh</option>
                <option value="Telangana">Telangana</option>
            </select>
        </div>

        <div class="field">
            <label>Skills *</label>

            <div class="options">

                <label>
                    <input type="checkbox"
                           name="skills"
                           value="JavaScript">
                    JavaScript
                </label>

                <label>
                    <input type="checkbox"
                           name="skills"
                           value="Python">
                    Python
                </label>

                <br>

                <label>
                    <input type="checkbox"
                           name="skills"
                           value="C++">
                    C++
                </label>

                <label>
                    <input type="checkbox"
                           name="skills"
                           value="Java">
                    Java
                </label>

            </div>
        </div>

        <br>

        <button type="submit">Submit</button>

    </form>

</div>

<footer>
    <p>Keerthana - Science Fair Project Site</p>
    <p>Web Technology Experiment 10</p>
</footer>

</body>
</html>
